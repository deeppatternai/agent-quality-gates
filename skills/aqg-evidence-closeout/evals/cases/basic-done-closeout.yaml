id: basic-done-closeout
title: 完整证据应生成 DONE 收口
description: 验证六项证据和 worktree 状态齐全时，最终答复使用完整的 closeout 结构并给出 DONE。

input:
  prompt: |
    只根据 aqg-evidence-closeout 技能说明回答，不要调用工具。请根据以下最新证据生成最终答复：
    - 修改了 docs/guide.md；
    - 刚运行 `python3 -m pytest -q tests/test_guide.py`，结果 12 passed，exit 0；
    - 这是纯文档改动，根据策略不需要 audit；
    - PR 描述已经同步；
    - 未触碰 production、deploy、restart、secrets 或 raw data；
    - worktree clean；
    - 没有剩余 blocker。
    必须使用 Status、Scope、Verification、Audit/Review、Durable State、Worktree、Boundaries、Remaining 结构。

expect:
  must_not_contain:
    - "Status: BLOCKED"

judge:
  type: rule_based
  success:
    - output_matches:
        all:
          - '(?is)(?:Status|顶层状态).*?(?:DONE|已完成|Complete|完成)'
          - '(?i)Scope|范围'
          - '(?i)Verification|验证'
          - '(?i)Audit/Review|审计'
          - '(?i)Durable State|持久状态'
          - '(?i)Worktree|工作区'
          - '(?i)Boundaries|边界'
          - '(?i)Remaining|剩余'
          - '12 passed'
        not: ['(?i)Status:\s*BLOCKED']
    - exit_code: 0
