id: incomplete-session-handoff
title: 未完成的跨会话交接应保持 PARTIAL
description: 验证交给下一 session 不等于任务完成，必须列出剩余工作并建议 handoff 信息。

input:
  prompt: |
    上下文快满了，需要交给下一个 session，但实现只完成一半，还有两个测试失败。请依据 aqg-evidence-closeout 写简短收口。
    请给出真实顶层状态，包含 handoff、Remaining、两个测试失败，并避免提前宣称完成。
    不要调用工具或访问仓库；根据“实现只完成一半、两个测试失败”这一已知事实使用 PARTIAL，不要因缺少仓库上下文改成 BLOCKED。

expect:
  must_not_contain:
    - "Status: DONE"

judge:
  type: rule_based
  success:
    - output_matches:
        all:
          - '(?is)(?:Status|状态|顶层状态).*?PARTIAL'
          - '(?i)handoff'
          - '(?i)Remaining:?|剩余'
          - '(?:两个|2)(?:个|项)?(?:实现)?测试(?:仍)?失败|(?:两个|2).*测试.*失败|测试.*(?:两个|2).*失败|测试仍有.*失败|失败\s*1.*失败\s*2|测试失败\s*#?1.*测试失败\s*#?2'
        not: ['(?i)Status:\s*DONE']
    - exit_code: 0
