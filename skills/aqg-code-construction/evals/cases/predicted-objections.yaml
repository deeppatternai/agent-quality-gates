id: predicted-objections
title: Predicted Objections 应包含可验证的反对意见
description: 验证 Skill 会说明 file:line、changed file、具体缓解方式和不同 path tier 的最小 objection 数。

input:
  prompt: |
    只根据 aqg-code-construction 技能说明回答，不要读仓库、不要调用工具；请用 8 行以内说明 Predicted Objections section 怎么写才不会被 checker 拒绝，不要写代码。
    回答必须包含 file:line、changed file、concrete mitigation、mini、full、plan 和 objections_diff_coverage_exception。

expect:
  must_contain:
    - "file:line"
    - "changed file"
    - "concrete mitigation"
    - "mini"
    - "full"
    - "plan"
    - "objections_diff_coverage_exception"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "file:line"
          - "changed file"
          - "concrete mitigation"
          - "mini"
          - "full"
          - "plan"
          - "objections_diff_coverage_exception"
    - exit_code: 0
