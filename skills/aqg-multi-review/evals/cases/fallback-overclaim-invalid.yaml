id: fallback-overclaim-invalid
title: fallback ledger 不应绑定真实 cross-panel audit_id
description: 验证 Skill 会阻止把 session-LLM fallback ledger 伪装成独立 cross-vendor panel。

input:
  prompt: |
    只根据 aqg-multi-review 技能说明回答，不要读仓库、不要调用工具；如果一个 ledger 同时声明 fallback_mode: session-llm，又填了真实 cross-panel audit_id，这是什么问题，应该怎么处理？
    回答必须包含 fallback_mode: session-llm、real cross-panel audit_id、cross-vendor、independent panel、overclaim、invalid、audit_id: null 和 needs-cross-llm-rerun。

expect:
  must_contain:
    - "fallback_mode: session-llm"
    - "real cross-panel audit_id"
    - "cross-vendor"
    - "independent panel"
    - "overclaim"
    - "invalid"
    - "audit_id: null"
    - "needs-cross-llm-rerun"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "fallback_mode: session-llm"
          - "real cross-panel audit_id"
          - "cross-vendor"
          - "independent panel"
          - "overclaim"
          - "invalid"
          - "audit_id: null"
          - "needs-cross-llm-rerun"
    - exit_code: 0
