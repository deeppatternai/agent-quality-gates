schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .
    include:
      - SKILL.md
      - scripts/**
      - agents/**

engine:
  name: codex
  model:
    name: gpt-5.6-luna

cases:
  files:
    - evals/cases/signal-only-boundary.yaml
    - evals/cases/behavior-vs-shape.yaml
    - evals/cases/audit-policy-depth.yaml
    - evals/cases/anti-horizontal-boundary.yaml
    - evals/cases/ledger-contract.yaml
    - evals/cases/language-hygiene.yaml
    - evals/cases/concern-signal-matrix.yaml
    - evals/cases/precision-first-boundary.yaml
    - evals/cases/alternatives-layering.yaml
  defaults:
    timeout_seconds: 600
    max_turns: 8
    expect:
      exit_code: 0
      must_not_contain:
        - "LGTM"
  parallelism: 1
  retry_policy:
    max_retries: 1
    retry_on:
      - timeout
      - error

judge:
  type: rule_based
  success:
    - exit_code: 0

report:
  formats:
    - json
    - html
