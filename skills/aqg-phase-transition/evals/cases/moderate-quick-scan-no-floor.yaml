id: moderate-quick-scan-no-floor
title: moderate stakes 的 quick scan 应保持 fast
description: 验证 safety floor 只约束 high stakes，不会错误提升普通改动。

input:
  prompt: |
    请先加载并使用已安装的 aqg-phase-transition Skill。允许读取该 Skill 的 SKILL.md 和配套内容；不要读取工作区中的其他项目文件，不要运行审计，也不要修改文件。
    场景：stakes=moderate，用户说 quick scan，且没有 dedup hit。
    仅按以下字段逐行给出 verdict，不要列出其他模式：
    requested_mode=<值>
    recommended_audit_mode=<值>
    user_override_applied=<true|false>
    safety_floor_applied=<true|false>

expect:
  must_contain:
    - "requested_mode=fast"
    - "recommended_audit_mode=fast"
    - "user_override_applied=true"
    - "safety_floor_applied=false"
  must_not_contain:
    - "recommended_audit_mode=deep"
    - "safety_floor_applied=true"
