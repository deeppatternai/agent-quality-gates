id: feedback_loop_first
title: 应先建立可复现反馈环再假设或修复
description: |
  验证 Skill 面对未知失败时，会先定义症状并捕获最小复现，不在没有 root-cause evidence 时提出修复。

input:
  prompt: |
    只根据 aqg-systematic-debugging 的说明回答，不要读仓库、不要调用工具。
    场景：CI 测试偶发失败，本地暂时复现不了，用户要求你直接改代码试试。
    请给出 6 行以内的 Debug status 草案。回答必须包含 feedback loop、symptom、reproduction、evidence、unconfirmed、cause not confirmed 和 fix proposal。

expect:
  must_contain:
    - "feedback loop"
    - "symptom"
    - "reproduction"
    - "evidence"
    - "unconfirmed"
    - "cause not confirmed"
    - "fix proposal"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "feedback loop"
          - "symptom"
          - "reproduction"
          - "evidence"
          - "unconfirmed"
          - "cause not confirmed"
          - "fix proposal"
    - exit_code: 0
