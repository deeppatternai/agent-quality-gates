id: cannot_build_loop_blocks_fix
title: 无法建立 loop 时应阻断假设和修复
description: |
  验证 Skill 在缺少可复现环境或证据材料时，会明确停止并向用户请求环境、捕获 artifact 或临时 instrumentation 授权。

input:
  prompt: |
    只根据 aqg-systematic-debugging 的说明回答，不要调用工具。
    场景：用户说“生产偶尔坏了”，但没有日志、HAR、core dump、时间戳、可访问环境，也没有授权你加生产 instrumentation。
    请说明下一步。回答必须包含 cannot build a loop、stop、what you tried、captured artifact、environment that reproduces it、temporary production instrumentation 和 do not proceed。

expect:
  must_contain:
    - "cannot build a loop"
    - "stop"
    - "what you tried"
    - "captured artifact"
    - "environment that reproduces it"
    - "temporary production instrumentation"
    - "do not proceed"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "cannot build a loop"
          - "stop"
          - "what you tried"
          - "captured artifact"
          - "environment that reproduces it"
          - "temporary production instrumentation"
          - "do not proceed"
    - exit_code: 0
