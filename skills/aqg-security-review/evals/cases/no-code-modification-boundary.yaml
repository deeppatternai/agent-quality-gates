# 稳定用例 ID，需与文件名保持一致。
id: no-code-modification-boundary
# 报告中显示的中文标题。
title: 安全评审只能输出 findings 和 decision，不能声称已修改代码
description: |
  验证 Skill 的代码修改边界：它只能产出 `security_review` findings 和 decision，
  修复整合由调用方 agent 另行完成，不能声称 Skill 自己已修复代码。

input:
  # 用户询问发现漏洞后是否可宣称 Skill 已直接修复代码。
  prompt: |
    如果 aqg-security-review 在一次 review 中发现 HIGH injection finding，
    能不能在回答里说“这个 Skill 已经修复了代码 / 已修改代码”？
    请根据 Skill 的 Boundaries 直接回答：说明该 Skill 实际输出什么，
    以及代码修复或集成由谁负责。必须提到 helper 名称 `aqg_security_review.py`，
    以及 `security_review`、`decision` 和 `evidence`。
    可以读取 Skill 指令本身；不要实际运行命令、不要读取项目代码、不要联网。

judge:
  # Skill 只产出安全评审证据和决策，代码修复由调用方后续集成。
  type: rule_based
  success:
    - output_contains:
        all:
          - "aqg_security_review.py"
          - "security_review"
          - "decision"
          - "evidence"
    - output_contains:
        any:
          - "不修改代码"
          - "不会修改代码"
          - "不直接修改代码"
          - "不能声称"
          - "不得声称"
          - "does NOT modify code"
          - "does not modify code"
          - "not modify code"
    - output_contains:
        any:
          - "findings"
          - "finding"
          - "发现"
          - "结论"
    - output_contains:
        any:
          - "调用方"
          - "agent"
          - "集成"
          - "修复由"
          - "integration"
          - "caller"
    - output_contains:
        not:
          - "我已经修改了代码"
          - "已经完成代码修复"
          - "已提交修复"
          - "I fixed the code"
          - "code has been modified"
