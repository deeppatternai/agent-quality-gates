id: specific-user-decision-action
title: needs-user-decision 必须记录具体参与者和问题
description: 防止 action 退化为 ask someone 或 wait for guidance。

context:
  repo_fixture: .

input:
  prompt: |
    请先读取当前评测工作区根目录的 SKILL.md，并严格按其中的 aqg-audit-adjudication 规则作答；不要使用用户目录中可能存在的同名旧版 Skill。不要修改文件。
    一个 finding 需要产品负责人决定公开 API 是否保持兼容。说明 needs-user-decision 行的 action 最少要包含什么。
    仅按以下字段逐行作答：
    actor=<specific|vague>
    question=<specific|vague>
    blocked_action=<specific|vague>
    decision_evidence=<specific|vague>
    vague_phrase_allowed=<yes|no>

expect:
  must_contain:
    - "actor=specific"
    - "question=specific"
    - "blocked_action=specific"
    - "decision_evidence=specific"
    - "vague_phrase_allowed=no"
  must_not_contain:
    - "actor=vague"
    - "question=vague"
    - "vague_phrase_allowed=yes"
