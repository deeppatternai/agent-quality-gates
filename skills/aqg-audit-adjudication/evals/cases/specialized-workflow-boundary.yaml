id: specialized-workflow-boundary
title: 裁决 Skill 不替代 security 或 test-quality 等专用审查流程
description: 覆盖 When NOT to use 中 specialized workflow 的职责边界。

context:
  repo_fixture: .

input:
  prompt: |
    请先读取当前评测工作区根目录的 SKILL.md，并严格按其中的 aqg-audit-adjudication 规则作答；不要使用用户目录中可能存在的同名旧版 Skill。不要修改文件。
    用户尚无 findings，要求现在执行一次 authentication security review 和测试质量审查。aqg-audit-adjudication 应如何处理？
    仅按以下字段逐行作答：
    applies_now=<yes|no>
    run_security_review=<yes|no>
    run_test_quality_review=<yes|no>
    route_to_specialized_workflows=<yes|no>
    adjudicate_after_findings=<yes|no>

expect:
  must_contain:
    - "applies_now=no"
    - "run_security_review=no"
    - "run_test_quality_review=no"
    - "route_to_specialized_workflows=yes"
    - "adjudicate_after_findings=yes"
  must_not_contain:
    - "applies_now=yes"
    - "run_security_review=yes"
    - "run_test_quality_review=yes"
