id: independent-work-before-user-decision
title: 需要用户决定时仍应先完成独立核验和清理
description: 覆盖 needs-user-decision 不能成为提前停工或模糊等待的借口。

context:
  repo_fixture: .

input:
  prompt: |
    请先读取当前评测工作区根目录的 SKILL.md，并严格按其中的 aqg-audit-adjudication 规则作答；不要使用用户目录中可能存在的同名旧版 Skill。不要修改文件。
    一个 finding 需要产品负责人决定 API 语义，但本地回归测试、证据整理和不依赖该选择的清理仍可完成。应如何推进？
    仅按以下字段逐行作答：
    decision=<值>
    finish_independent_verification=<yes|no>
    finish_independent_cleanup=<yes|no>
    block_only=<dependent_action|all_work>
    vague_wait=<yes|no>

expect:
  must_contain:
    - "decision=needs-user-decision"
    - "finish_independent_verification=yes"
    - "finish_independent_cleanup=yes"
    - "block_only=dependent_action"
    - "vague_wait=no"
  must_not_contain:
    - "block_only=all_work"
    - "vague_wait=yes"
