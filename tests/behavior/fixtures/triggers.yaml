# AQG behavior tests trigger fixture v0
#
# Sketch v3 §3.2 mix: 70% description-based + 30% explicit invocation
# Sample: 5 case/skill × 11 skill = 55 case (extended past sketch v3 §3.3 D 档
# budget as new skills landed in Wave 3 / Sprint 11+ / 11.5 / 13 / 15 / 17.1)
# Distribution (42 desc + 13 explicit; ~76/24):
#   - aqg-startup-preflight:    3 desc + 2 explicit
#   - aqg-systematic-debugging: 4 desc + 1 explicit
#   - aqg-audit-adjudication:   3 desc + 2 explicit
#   - aqg-evidence-closeout:    4 desc + 1 explicit
#   - aqg-code-construction:    4 desc + 1 explicit (PR-C added per Wave 3)
#   - aqg-skill-validator:      4 desc + 1 explicit (Sprint 15)
#   - aqg-security-review:      4 desc + 1 explicit (Sprint 10)
#   - aqg-automation-audit:     4 desc + 1 explicit (Sprint 13)
#   - aqg-phase-transition:     4 desc + 1 explicit (Sprint 11; Claude wrapper added in #114 fix v0.8.1)
#   - aqg-multi-review:         4 desc + 1 explicit (Sprint 11.5; Claude wrapper added in #114 fix v0.8.1)
#   - aqg-test-quality-review:  4 desc + 1 explicit (2026-05-26; review-side test-quality skill)
# Per-case 1 run nightly (no N=5 majority vote at v0 — Wilson computed over 4-week
# accumulation per sketch v3 §4)
#
# NB (2026-05-31 PR-3): the SKILL.md drift-hash mechanism was retired once the
# overlay migration reached 13/13 managed skills. The M2 hash fields
# (description_sha256_first8 / trigger_section_sha256_first8) are now always
# null — kept (not deleted) because check_fixture_mix.py I7 asserts the
# `managed ⟺ M2-null` invariant from them. They are no longer drift baselines;
# the committed wrapper is guarded by the CI regen→git-status gate instead.
schema_version: 1
runner:
  primary: claude_p
  model: claude-sonnet-4-6
  per_run_budget_usd: 0.50
  per_nightly_budget_usd: 5.0
  timeout_s: 240
  permission_mode: default

