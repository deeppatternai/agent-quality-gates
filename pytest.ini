[pytest]
# Every skill ships its own `scripts/self_test.py`. Those directories are not
# importable packages (skill names contain hyphens), so pytest's default
# `prepend` import mode derives the module name from the basename alone and the
# identically-named files collide: `import file mismatch`. Without this, a bare
# `pytest` at the repo root aborts collection instead of running the suite.
#
# These files are not skipped tests — they are owned by a different runner.
# Their contract is to run standalone from their own scripts/ dir, which
# `bash scripts/run_skill_self_tests.sh` does and CI gates on. These two
# patterns MUST stay identical to that script's globs: pytest hides these files
# only because that script runs them, so any drift leaves one run by nothing.
addopts =
    --ignore-glob=skills/*/scripts/self_test.py
    --ignore-glob=templates/*/scripts/self_test.py
